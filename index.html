<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>API Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Sans:wght@400..700&family=JetBrains+Mono:wght@400..700&display=swap">
<style>
:root {
  --bg: #13213A; --panel: #1C2D4D; --line: #2E4370; --fg: #F6F3EC; --muted: #B9C3D6;
  --orange: #E8772E; --teal: #7FD1C1; --bad: #F07A7A;
  --a: #E8772E; --b: #4FA3E0; --c: #E2B93B; --d: #C46BD6;
  --display: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif;
  --body: 'DM Sans', Arial, sans-serif;
  --mono: 'JetBrains Mono', 'Courier New', monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 18px;
  padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
#app { min-height: 100%; max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }
.strip { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; align-items: center;
  font-family: var(--mono); font-size: 14px; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.strip b { color: var(--orange); }
.pill { font-family: var(--mono); font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.hot { border-color: var(--orange); color: var(--orange); }
.stage { flex: 1; display: flex; flex-direction: column; gap: 22px; justify-content: center; min-height: 0; }
.eyebrow { font-family: var(--mono); font-size: 14px; letter-spacing: 3px; text-transform: uppercase; color: var(--orange); }
.big { font-family: var(--display); font-weight: 800; font-size: clamp(52px, 9vw, 130px); line-height: .95; letter-spacing: -2px; margin: 0; }
.big span { color: var(--orange); }
h1.q { font-family: var(--display); font-weight: 700; font-size: clamp(26px, 4vw, 56px); line-height: 1.1; margin: 0; text-wrap: balance; }
.lead { font-size: clamp(17px, 1.8vw, 22px); color: var(--muted); margin: 0; line-height: 1.45; max-width: 62ch; }
.json { font-family: var(--mono); font-size: clamp(15px, 1.7vw, 22px); line-height: 1.55; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 22px; margin: 0; overflow-x: auto; white-space: pre; }
.json .k { color: var(--orange); } .json .v { color: var(--teal); }
.btn { background: var(--orange); color: #13213A; border: 0; border-radius: 12px; padding: 13px 24px; font-weight: 700; font-size: 18px; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.hint { font-size: 14px; color: var(--muted); }

/* host: join screen */
.join { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 32px; align-items: center; }
.joinbox { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; }
.joinbox .url { font-family: var(--mono); font-size: clamp(14px, 1.5vw, 20px); color: var(--muted); word-break: break-all; }
.joinbox .code { font-family: var(--mono); font-weight: 700; font-size: clamp(56px, 8vw, 110px); letter-spacing: 8px; color: var(--orange); line-height: 1; }
#qr { background: #F6F3EC; padding: 12px; border-radius: 12px; line-height: 0; }
#qr img, #qr canvas { width: min(240px, 60vw) !important; height: auto !important; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 17px; animation: pop .25s ease-out; }
@keyframes pop { from { transform: scale(.7); opacity: 0; } }

/* options */
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opt { position: relative; overflow: hidden; display: flex; gap: 14px; align-items: center; text-align: left; border-radius: 14px; padding: 16px 20px; font-size: clamp(18px, 2vw, 28px); border: 2px solid transparent; min-width: 0; background: var(--panel); }
.opt .l { flex: none; width: 1.7em; height: 1.7em; border-radius: 8px; display: grid; place-items: center; font-family: var(--mono); font-weight: 700; color: #13213A; }
.opt .t { position: relative; z-index: 1; min-width: 0; }
.opt .fill { position: absolute; inset: 0 auto 0 0; opacity: .18; transition: width .6s ease-out; }
.opt .n { margin-left: auto; position: relative; z-index: 1; font-family: var(--mono); font-weight: 700; }
.opt.dim { opacity: .4; }
.opt.right { border-color: var(--teal); }
.o0 .l, .o0 .fill { background: var(--a); } .o1 .l, .o1 .fill { background: var(--b); }
.o2 .l, .o2 .fill { background: var(--c); } .o3 .l, .o3 .fill { background: var(--d); }

.timer { display: flex; align-items: center; gap: 14px; }
.bar { flex: 1; height: 10px; background: var(--panel); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--orange); width: 100%; transition: width 1s linear; }
.secs { font-family: var(--mono); font-size: 22px; width: 3.5ch; text-align: right; font-variant-numeric: tabular-nums; }

/* boards */
.board { display: flex; flex-direction: column; gap: 8px; }
.brow { display: flex; align-items: center; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 18px; font-size: clamp(17px, 1.8vw, 24px); }
.brow .p { font-family: var(--mono); color: var(--muted); width: 2ch; }
.brow .nm { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brow .g { font-family: var(--mono); color: var(--teal); font-size: .8em; }
.brow .sc { font-family: var(--mono); font-weight: 700; font-variant-numeric: tabular-nums; }
.brow.first { border: 2px solid var(--orange); }
.brow.first .p, .brow.first .sc { color: var(--orange); }
.split { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 28px; align-items: start; }

.event { background: var(--panel); border: 2px dashed var(--orange); border-radius: 20px; padding: clamp(20px, 4vw, 48px); display: flex; flex-direction: column; gap: 16px; max-width: 900px; }
.event .code { font-family: var(--mono); font-weight: 700; font-size: clamp(36px, 6vw, 84px); color: var(--orange); line-height: 1; }

/* player (phone) */
.phone { max-width: 520px; width: 100%; margin: 0 auto; flex: 1; display: flex; flex-direction: column; gap: 18px; justify-content: center; }
.field { display: flex; flex-direction: column; gap: 6px; font-family: var(--mono); font-size: 13px; letter-spacing: 1px; color: var(--muted); }
.field input { font-family: var(--body); font-size: 22px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; color: var(--fg); width: 100%; }
.field input.code { font-family: var(--mono); letter-spacing: 6px; font-size: 30px; text-align: center; }
.pbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pbtn { border: 0; border-radius: 16px; min-height: 120px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; color: #13213A; font-weight: 700; font-size: 17px; }
.pbtn .L { font-family: var(--mono); font-size: 34px; line-height: 1; }
.pbtn.o0 { background: var(--a); } .pbtn.o1 { background: var(--b); } .pbtn.o2 { background: var(--c); } .pbtn.o3 { background: var(--d); }
.pbtn:active { transform: scale(.97); }
.result { border-radius: 20px; padding: 28px 22px; display: flex; flex-direction: column; gap: 8px; background: var(--panel); border: 2px solid var(--line); }
.result .code { font-family: var(--mono); font-weight: 700; font-size: 34px; }
.result.ok { border-color: var(--teal); } .result.ok .code { color: var(--teal); }
.result.no { border-color: var(--bad); } .result.no .code { color: var(--bad); }
.me { display: flex; justify-content: space-between; font-family: var(--mono); color: var(--muted); font-size: 15px; }
.me b { color: var(--fg); }
.err { color: var(--bad); font-size: 16px; min-height: 1.3em; }

@media (max-width: 760px) {
  .join, .split { grid-template-columns: 1fr; }
  .opts { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<body>
<div id="app"><div class="stage"><p class="lead">Loading API Rush…</p></div></div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
'use strict';
/* ---------- content ---------- */
const ROUNDS = [
  { name: 'Round 1 · Who am I?', path: 'vocabulary', mult: 1 },
  { name: 'Round 2 · Pick the method', path: 'methods', mult: 1 },
  { name: 'Round 3 · Read the JSON', path: 'json', mult: 1 },
  { name: 'Final round · Double points', path: 'final', mult: 2 },
];
const JSON_SAMPLE = '{\n  <k>"student"</k>: <v>"Ana"</v>,\n  <k>"group"</k>: <v>"11-A"</v>,\n  <k>"grade"</k>: <v>95</v>,\n  <k>"passed"</k>: <v>true</v>\n}';
const Q = [
  { r: 0, q: 'I am the computer that stores the data and answers requests. Who am I?', o: ['Client', 'Server', 'Endpoint', 'JSON'], a: 1 },
  { r: 0, q: 'I am a secret code that tells the server who is using the API. Who am I?', o: ['API key', 'Response', 'Browser', 'Status code'], a: 0 },
  { r: 0, q: 'I am the exact address (URL) where you send a request. Who am I?', o: ['Server', 'Client', 'Endpoint', 'Method'], a: 2 },
  { r: 1, q: 'You open your Instagram profile to see your photos.', o: ['GET', 'POST', 'PUT', 'DELETE'], a: 0 },
  { r: 1, q: 'You send a new message on WhatsApp.', o: ['GET', 'POST', 'PUT', 'DELETE'], a: 1 },
  { r: 1, q: 'You change your profile picture.', o: ['GET', 'POST', 'PUT', 'DELETE'], a: 2 },
  { r: 2, json: true, q: 'What is the value of the key "group"?', o: ['"group"', '"11-A"', '"Ana"', '95'], a: 1 },
  { r: 2, json: true, q: 'How many keys does this response have?', o: ['2', '8', '4', '1'], a: 2 },
  { r: 2, json: true, q: 'Which one of these is a KEY?', o: ['"Ana"', '95', 'true', '"grade"'], a: 3 },
  { r: 3, q: 'You see the status code 404. What does it mean?', o: ['Everything worked', 'Not found', 'Too many requests', 'Wrong password'], a: 1 },
  { r: 3, q: 'You want to remove an old comment. Which method?', o: ['GET', 'PUT', 'DELETE', 'POST'], a: 2 },
  { r: 3, q: 'In the restaurant example, the waiter is the…', o: ['Client', 'Server', 'Database', 'API'], a: 3 },
];
const EVENTS = [
  { kind: 'double', code: '2× BONUS', text: 'Server upgrade! The next challenge is worth double points for everyone.' },
  { kind: 'block', code: '429 RATE LIMIT', text: 'The player in first place made too many requests. They can’t score on the next challenge.' },
  { kind: 'gift', code: '201 CREATED', text: 'The server created a gift: the 3 players in last place get +300 points.' },
];
const EVENT_BEFORE = [3, 6, 9];
const TIME = 20;
const L = ['A', 'B', 'C', 'D'];
const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];

/* ---------- helpers ---------- */
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const params = new URLSearchParams(location.search);
const IS_HOST = params.has('host');
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const topic = (code, t) => `apirush-live/v1/${code}/${t}`;
const jsonHTML = () => '<pre class="json">' + JSON_SAMPLE.replace(/<k>/g, '<span class="k">').replace(/<v>/g, '<span class="v">').replace(/<\/[kv]>/g, '</span>') + '</pre>';
const baseURL = () => location.origin + location.pathname;

function connect(idx) {
  return new Promise((resolve, reject) => {
    if (!window.mqtt) return reject(new Error('lib'));
    const c = mqtt.connect(BROKERS[idx], {
      clientId: 'apirush_' + Math.random().toString(16).slice(2, 12),
      clean: true, connectTimeout: 7000, reconnectPeriod: 2000, keepalive: 30,
    });
    let done = false;
    c.on('connect', () => { if (!done) { done = true; resolve(c); } });
    setTimeout(() => { if (!done) { done = true; try { c.end(true); } catch (e) {} reject(new Error('timeout')); } }, 8000);
  });
}
async function connectAny(first) {
  const order = first === 1 ? [1, 0] : [0, 1];
  for (const i of order) { try { return { c: await connect(i), b: i }; } catch (e) {} }
  return null;
}

let actx = null;
function beep(f, d) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = f; o.type = 'square'; g.gain.value = 0.04;
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
  } catch (e) {}
}

/* =================================================================
   HOST (projector)
   ================================================================= */
const H = {
  code: null, client: null, b: 0, phase: 'connecting', i: -1,
  players: {}, answers: {}, bonus: 1, blocked: null, pendBonus: 1, pendBlocked: null,
  ev: null, evQueue: [], evDone: {}, left: TIME, endsAt: 0, tick: null, lastGain: {}, giftNames: [],
};

function hostBoard() {
  return Object.entries(H.players).map(([id, p]) => ({ id, name: p.name, score: p.score, gain: H.lastGain[id] || 0 }))
    .sort((x, y) => y.score - x.score || x.name.localeCompare(y.name));
}
function hostCounts() {
  const n = [0, 0, 0, 0];
  Object.values(H.answers).forEach(a => { if (a.c >= 0 && a.c < 4) n[a.c]++; });
  return n;
}
function hostPublish() {
  if (!H.client) return;
  const q = H.i >= 0 && H.i < Q.length ? Q[H.i] : null;
  const showQ = H.phase === 'question' || H.phase === 'reveal';
  const payload = {
    phase: H.phase, i: H.i, total: Q.length, left: H.phase === 'question' ? Math.max(0, Math.ceil((H.endsAt - Date.now()) / 1000)) : 0,
    q: showQ ? { q: q.q, o: q.o, json: !!q.json, round: ROUNDS[q.r].name } : null,
    correct: H.phase === 'reveal' ? q.a : null,
    mult: showQ ? ROUNDS[q.r].mult * H.bonus : 1,
    blocked: H.blocked, ev: H.phase === 'event' ? H.ev : null, gift: H.giftNames,
    board: hostBoard(), n: Date.now(),
  };
  H.client.publish(topic(H.code, 'state'), JSON.stringify(payload), { qos: 1, retain: true });
}

async function hostStart() {
  H.code = String(Math.floor(1000 + Math.random() * 9000));
  hostRender();
  const r = await connectAny(0);
  if (!r) { H.phase = 'offline'; hostRender(); return; }
  H.client = r.c; H.b = r.b;
  H.client.subscribe([topic(H.code, 'join'), topic(H.code, 'ans')], { qos: 1 });
  H.client.on('message', (t, buf) => {
    let m; try { m = JSON.parse(buf.toString()); } catch (e) { return; }
    if (!m || typeof m.id !== 'string' || m.id.length > 40) return;
    if (t.endsWith('/join')) hostJoin(m);
    else if (t.endsWith('/ans')) hostAnswer(m);
  });
  H.phase = 'lobby'; hostRender(); hostPublish();
}

function hostJoin(m) {
  const name = String(m.name || '').trim().slice(0, 18) || 'Player';
  const known = H.players[m.id];
  if (known && known.name === name) { hostPublish(); return; }
  if (known) known.name = name; else { H.players[m.id] = { name, score: 0 }; beep(880, .05); }
  hostRender(); hostPublish();
}

function hostAnswer(m) {
  if (H.phase !== 'question' || m.i !== H.i || !H.players[m.id] || H.answers[m.id]) return;
  const c = Number(m.c); if (!(c >= 0 && c < 4)) return;
  H.answers[m.id] = { c, rem: Math.max(0, H.endsAt - Date.now()) };
  const el = document.getElementById('answered');
  if (el) el.textContent = Object.keys(H.answers).length + ' / ' + Object.keys(H.players).length + ' answered';
  if (Object.keys(H.answers).length >= Object.keys(H.players).length) hostReveal();
}

function hostGo() {
  H.lastGain = {};
  if (H.i >= Q.length) { H.phase = 'final'; stopHostTimer(); hostRender(); hostPublish(); beep(880, .4); return; }
  const slot = EVENT_BEFORE.indexOf(H.i);
  if (slot >= 0 && !H.evDone[H.i]) {
    H.evDone[H.i] = true; H.ev = H.evQueue[slot % H.evQueue.length]; H.giftNames = [];
    H.phase = 'event'; hostRender(); hostPublish(); beep(220, .25); return;
  }
  H.bonus = H.pendBonus; H.blocked = H.pendBlocked; H.pendBonus = 1; H.pendBlocked = null;
  H.answers = {}; H.phase = 'question'; H.endsAt = Date.now() + TIME * 1000;
  hostRender(); hostPublish(); startHostTimer();
}

function hostApplyEvent() {
  const e = H.ev, board = hostBoard();
  if (e.kind === 'double') H.pendBonus = 2;
  if (e.kind === 'block' && board.length && board[0].score > 0) H.pendBlocked = board[0].id;
  if (e.kind === 'gift') {
    const last = board.slice().reverse().slice(0, 3);
    last.forEach(p => { H.players[p.id].score += 300; H.lastGain[p.id] = 300; });
    H.giftNames = last.map(p => p.name);
  }
  H.ev = null; hostGo();
}

function startHostTimer() {
  stopHostTimer();
  H.tick = setInterval(() => {
    const left = Math.max(0, Math.ceil((H.endsAt - Date.now()) / 1000));
    const bar = document.querySelector('.bar i'), secs = document.querySelector('.secs');
    if (bar) { bar.style.width = (left / TIME * 100) + '%'; bar.style.background = left <= 5 ? 'var(--bad)' : 'var(--orange)'; }
    if (secs) secs.textContent = left + 's';
    if (left <= 3 && left > 0) beep(660, .06);
    if (left === 0) hostReveal();
  }, 250);
}
function stopHostTimer() { if (H.tick) clearInterval(H.tick); H.tick = null; }

function hostReveal() {
  if (H.phase !== 'question') return;
  stopHostTimer();
  const q = Q[H.i], mult = ROUNDS[q.r].mult * H.bonus;
  H.lastGain = {};
  Object.entries(H.answers).forEach(([id, a]) => {
    if (a.c !== q.a || id === H.blocked || !H.players[id]) return;
    const g = Math.round((500 + 500 * (a.rem / (TIME * 1000))) * mult / 10) * 10;
    H.players[id].score += g; H.lastGain[id] = g;
  });
  H.phase = 'reveal'; hostRender(); hostPublish(); beep(990, .15);
}
function hostNext() { H.bonus = 1; H.blocked = null; H.i++; hostGo(); }

function boardRows(list, max, showGain) {
  return '<div class="board">' + list.slice(0, max).map((p, k) =>
    `<div class="brow${k === 0 ? ' first' : ''}"><span class="p">${k + 1}</span><span class="nm">${esc(p.name)}</span>${showGain && p.gain ? `<span class="g">+${p.gain}</span>` : ''}<span class="sc">${p.score}</span></div>`
  ).join('') + '</div>';
}

function hostRender() {
  const n = Object.keys(H.players).length;
  if (H.phase === 'connecting') {
    app.innerHTML = `<div class="stage"><h1 class="big">API <span>Rush</span></h1><p class="lead">Connecting to the game server…</p></div>`;
    return;
  }
  if (H.phase === 'offline') {
    app.innerHTML = `<div class="stage"><h1 class="q">Can’t reach the game server</h1>
      <p class="lead">The school network may be blocking it. Connect this computer to a phone hotspot or another network and try again.</p>
      <div class="row"><button class="btn" id="retry">Try again</button></div></div>`;
    document.getElementById('retry').onclick = () => location.reload();
    return;
  }
  if (H.phase === 'lobby') {
    const link = baseURL() + '?code=' + H.code + (H.b ? '&b=' + H.b : '');
    app.innerHTML = `
      <div class="strip"><span><b>POST</b> /game/${H.code}/join</span><span class="pill">${n} player${n === 1 ? '' : 's'} connected</span></div>
      <div class="stage">
        <div class="join">
          <div style="display:flex;flex-direction:column;gap:20px;min-width:0">
            <h1 class="big">API <span>Rush</span></h1>
            <p class="lead">Scan the code or open the link on your phone, type your name and wait for the first request. Answer fast: speed gives you more points.</p>
            <div class="chips" id="chips">${Object.values(H.players).map(p => `<span class="chip">${esc(p.name)}</span>`).join('') || '<span class="hint">Waiting for players…</span>'}</div>
            <div class="row"><button class="btn" id="start" ${n ? '' : 'disabled'}>Start the game</button><span class="hint">Presenter keys: N = next · Space = reveal now</span></div>
          </div>
          <div class="joinbox">
            <div id="qr"></div>
            <div class="url">${esc(baseURL())}</div>
            <div class="eyebrow">Game code</div>
            <div class="code">${H.code}</div>
          </div>
        </div>
      </div>`;
    try { new QRCode(document.getElementById('qr'), { text: link, width: 240, height: 240, colorDark: '#13213A', colorLight: '#F6F3EC' }); } catch (e) {}
    document.getElementById('start').onclick = () => { H.evQueue = EVENTS.slice().sort(() => Math.random() - .5); H.i = 0; hostGo(); };
    return;
  }
  if (H.phase === 'event') {
    app.innerHTML = `
      <div class="strip"><span><b>EVENT</b> /server/surprise</span><span class="pill hot">Before challenge ${H.i + 1} of ${Q.length}</span></div>
      <div class="stage"><div class="event"><span class="code">${H.ev.code}</span><p class="lead" style="color:var(--fg)">${H.ev.text}</p>
      <div class="row"><button class="btn" id="ok">Apply and continue</button></div></div></div>`;
    document.getElementById('ok').onclick = hostApplyEvent;
    return;
  }
  if (H.phase === 'final') {
    const b = hostBoard();
    app.innerHTML = `
      <div class="strip"><span><b>GET</b> /game/${H.code}/results</span><span class="pill hot">200 OK</span></div>
      <div class="stage"><h1 class="big">And the winner is<span>…</span></h1>
      ${b.length ? `<h1 class="q" style="color:var(--orange)">${esc(b[0].name)} · ${b[0].score} pts</h1>` : ''}
      ${boardRows(b, 8, false)}</div>`;
    return;
  }
  const q = Q[H.i], round = ROUNDS[q.r], mult = round.mult * H.bonus;
  const reveal = H.phase === 'reveal', counts = hostCounts(), total = Math.max(1, Object.keys(H.answers).length);
  const blockedName = H.blocked && H.players[H.blocked] ? H.players[H.blocked].name : null;
  const opts = `<div class="opts">${q.o.map((o, k) => `
      <div class="opt o${k}${reveal ? (k === q.a ? ' right' : ' dim') : ''}">
        ${reveal ? `<span class="fill" style="width:${counts[k] / total * 100}%"></span>` : ''}
        <span class="l">${L[k]}</span><span class="t">${esc(o)}</span>${reveal ? `<span class="n">${counts[k]}</span>` : ''}
      </div>`).join('')}</div>`;
  app.innerHTML = `
    <div class="strip"><span><b>GET</b> /${round.path}/challenge/${H.i + 1}</span>
      <span class="row" style="gap:8px">${mult > 1 ? `<span class="pill hot">${mult}× points</span>` : ''}${blockedName ? `<span class="pill hot">429: ${esc(blockedName)}</span>` : ''}<span class="pill">${H.i + 1} / ${Q.length}</span></span></div>
    <div class="stage">
      <span class="eyebrow">${round.name}</span>
      ${reveal ? `<div class="split"><div style="display:flex;flex-direction:column;gap:18px;min-width:0">
          ${q.json ? jsonHTML() : ''}<h1 class="q">${esc(q.q)}</h1>${opts}
          <div class="row"><button class="btn" id="next">${H.i === Q.length - 1 ? 'See results' : 'Next challenge'}</button></div></div>
        <div style="display:flex;flex-direction:column;gap:10px;min-width:0"><span class="eyebrow" style="color:var(--teal)">200 OK · Top 5</span>${boardRows(hostBoard(), 5, true)}</div></div>`
      : `${q.json ? jsonHTML() : ''}<h1 class="q">${esc(q.q)}</h1>${opts}
        <div class="timer"><div class="bar"><i style="width:100%"></i></div><span class="secs">${TIME}s</span></div>
        <div class="row" style="justify-content:space-between"><span class="pill" id="answered">${Object.keys(H.answers).length} / ${n} answered</span><button class="btn ghost" id="rev">Reveal now</button></div>`}
    </div>`;
  const nx = document.getElementById('next'); if (nx) nx.onclick = hostNext;
  const rv = document.getElementById('rev'); if (rv) rv.onclick = hostReveal;
}

/* =================================================================
   PLAYER (phone)
   ================================================================= */
const P = {
  id: store.get('apirush-id') || ('p' + Math.random().toString(36).slice(2, 12)),
  name: store.get('apirush-name') || '', code: params.get('code') || '', b: params.get('b') === '1' ? 1 : 0,
  client: null, S: null, choice: null, choiceFor: -1, tick: null, endsAt: 0, err: '', joined: false,
};
store.set('apirush-id', P.id);

function playerJoinForm() {
  app.innerHTML = `
    <div class="phone">
      <h1 class="big" style="font-size:64px">API <span>Rush</span></h1>
      <label class="field" for="pcode">GAME CODE<input class="code" id="pcode" inputmode="numeric" maxlength="4" autocomplete="off" value="${esc(P.code)}"></label>
      <label class="field" for="pname">YOUR NAME<input id="pname" maxlength="18" autocomplete="off" value="${esc(P.name)}"></label>
      <button class="btn" id="pjoin">Join the game</button>
      <div class="err" id="perr">${esc(P.err)}</div>
    </div>`;
  const go = async () => {
    const code = document.getElementById('pcode').value.trim(), name = document.getElementById('pname').value.trim();
    if (!/^\d{4}$/.test(code)) { document.getElementById('perr').textContent = 'Type the 4-digit code on the board.'; return; }
    if (!name) { document.getElementById('perr').textContent = 'Type your name.'; return; }
    P.code = code; P.name = name.slice(0, 18); store.set('apirush-name', P.name);
    document.getElementById('pjoin').disabled = true; document.getElementById('pjoin').textContent = 'Connecting…';
    await playerConnect();
  };
  document.getElementById('pjoin').onclick = go;
  document.getElementById('pname').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

async function playerConnect() {
  const r = await connectAny(P.b);
  if (!r) { P.err = 'Can’t reach the game server. Try mobile data instead of the school Wi-Fi.'; playerJoinForm(); return; }
  P.client = r.c;
  P.client.subscribe(topic(P.code, 'state'), { qos: 1 });
  P.client.on('message', (t, buf) => {
    let s; try { s = JSON.parse(buf.toString()); } catch (e) { return; }
    playerState(s);
  });
  P.client.on('connect', sendJoin);
  sendJoin();
  P.joined = true;
  app.innerHTML = `<div class="phone"><p class="lead">Connected. Waiting for the game on the board…</p>
    <p class="hint">Code ${esc(P.code)}. If nothing happens in 10 seconds, check the code.</p></div>`;
}
function sendJoin() { if (P.client) P.client.publish(topic(P.code, 'join'), JSON.stringify({ id: P.id, name: P.name }), { qos: 1 }); }

let lastJoinAt = 0;
function playerState(s) {
  if (!s || !Array.isArray(s.board)) return;
  const inBoard = s.board.some(p => p.id === P.id);
  if (!inBoard && Date.now() - lastJoinAt > 3000) { lastJoinAt = Date.now(); sendJoin(); }
  const prev = P.S; P.S = s;
  const fresh = !prev || prev.phase !== s.phase || prev.i !== s.i;
  if (s.phase === 'question' && fresh) { P.endsAt = Date.now() + (s.left || 0) * 1000; if (P.choiceFor !== s.i) P.choice = null; }
  if (fresh && s.phase === 'reveal') { try { navigator.vibrate && navigator.vibrate(80); } catch (e) {} }
  playerRender();
}

function playerAnswer(k) {
  const s = P.S; if (!s || s.phase !== 'question' || P.choiceFor === s.i) return;
  P.choice = k; P.choiceFor = s.i;
  P.client.publish(topic(P.code, 'ans'), JSON.stringify({ id: P.id, i: s.i, c: k }), { qos: 1 });
  playerRender();
}

function myRow(s) {
  const k = s.board.findIndex(p => p.id === P.id);
  return k < 0 ? null : { rank: k + 1, ...s.board[k] };
}
function meBar(s) {
  const m = myRow(s);
  return `<div class="me"><span><b>${esc(P.name)}</b></span><span>${m ? `#${m.rank} of ${s.board.length} · <b>${m.score}</b> pts` : ''}</span></div>`;
}

function playerRender() {
  const s = P.S; if (!s) return;
  if (P.tick) { clearInterval(P.tick); P.tick = null; }
  if (s.phase === 'lobby') {
    app.innerHTML = `<div class="phone">${meBar(s)}<h1 class="q">You’re in! <span style="color:var(--orange)">200 OK</span></h1>
      <p class="lead">${s.board.length} player${s.board.length === 1 ? '' : 's'} connected. Look at the board, the game starts soon.</p></div>`;
    return;
  }
  if (s.phase === 'event' && s.ev) {
    app.innerHTML = `<div class="phone">${meBar(s)}<div class="event"><span class="code" style="font-size:40px">${esc(s.ev.code)}</span><p class="lead" style="color:var(--fg)">${esc(s.ev.text)}</p></div></div>`;
    return;
  }
  if (s.phase === 'final') {
    const m = myRow(s);
    app.innerHTML = `<div class="phone"><span class="eyebrow">GET /game/results · 200 OK</span>
      <h1 class="big" style="font-size:72px">${m ? '#' + m.rank : '—'}</h1>
      <p class="lead" style="color:var(--fg)">${m ? m.score + ' points' : ''}${m && m.rank === 1 ? ' · You won!' : ''}</p>
      ${boardRows(s.board, 5, false)}</div>`;
    return;
  }
  if (!s.q) return;
  if (s.phase === 'question') {
    const answered = P.choiceFor === s.i;
    const blocked = s.blocked === P.id;
    app.innerHTML = `<div class="phone">${meBar(s)}
      <div class="row" style="justify-content:space-between"><span class="eyebrow">${s.i + 1} / ${s.total}${s.mult > 1 ? ' · ' + s.mult + '× points' : ''}</span><span class="secs" id="psecs"></span></div>
      ${blocked ? '<p class="err">429 Rate limit: you can’t score on this one.</p>' : ''}
      <p style="margin:0;font-size:20px;line-height:1.35">${esc(s.q.q)}</p>
      ${answered
        ? `<div class="result"><span class="code" style="color:var(--orange)">202 Accepted</span><p class="lead">You answered <b style="color:var(--fg)">${L[P.choice]}</b>. Wait for the response on the board.</p></div>`
        : `<div class="pbtns">${s.q.o.map((o, k) => `<button class="pbtn o${k}" data-k="${k}"><span class="L">${L[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>`}
    </div>`;
    app.querySelectorAll('[data-k]').forEach(b => b.onclick = () => playerAnswer(+b.dataset.k));
    const upd = () => {
      const left = Math.max(0, Math.ceil((P.endsAt - Date.now()) / 1000));
      const el = document.getElementById('psecs'); if (el) el.textContent = left + 's';
      if (left === 0 && !answered) { app.querySelectorAll('[data-k]').forEach(b => b.disabled = true); }
    };
    upd(); P.tick = setInterval(upd, 250);
    return;
  }
  if (s.phase === 'reveal') {
    const m = myRow(s);
    const mine = P.choiceFor === s.i ? P.choice : null;
    let cls, code, msg;
    if (mine === null) { cls = 'no'; code = '408 Timeout'; msg = 'No answer this time.'; }
    else if (mine === s.correct) {
      cls = 'ok'; code = '200 OK';
      msg = s.blocked === P.id ? 'Correct, but you were rate limited: 0 points.' : `Correct! +${(m && m.gain) || 0} points`;
    } else { cls = 'no'; code = '400 Bad Request'; msg = `The answer was ${L[s.correct]}: ${esc(s.q.o[s.correct])}.`; }
    app.innerHTML = `<div class="phone">${meBar(s)}<div class="result ${cls}"><span class="code">${code}</span><p class="lead" style="color:var(--fg)">${msg}</p></div>
      <p class="hint">${m ? `You are #${m.rank} with ${m.score} points.` : ''} Next challenge coming…</p></div>`;
  }
}

/* ---------- boot ---------- */
document.addEventListener('keydown', e => {
  if (!IS_HOST || e.target.tagName === 'INPUT') return;
  if (e.key === ' ' && H.phase === 'question') { e.preventDefault(); hostReveal(); }
  if (e.key === 'n' || e.key === 'N') {
    if (H.phase === 'reveal') hostNext();
    else if (H.phase === 'event') hostApplyEvent();
  }
});
if (IS_HOST) hostStart();
else if (P.code && P.name) { playerJoinForm(); }
else playerJoinForm();
</script>
</body>
